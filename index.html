<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fractal Hash</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #widget {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 10;
        width: min(360px, calc(100vw - 32px));
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        font:
          12px/1.5 ui-monospace,
          monospace;
        color: #fff;
        background: #000;
        border: 1px solid #fff;
      }

      #widget .label {
        display: block;
        font-size: 10px;
      }

      #widget .value {
        display: block;
        max-height: 6.5em;
        overflow-y: auto;
        overflow-wrap: anywhere;
        color: rgba(255, 255, 255, 0.92);
      }

      #widget .actions {
        display: flex;
        gap: 6px;
      }

      #widget button {
        flex: 1;
        padding: 7px 4px;
        font: inherit;
        color: inherit;
        background: #000;
        border: 1px solid #fff;
        cursor: pointer;
        transition:
          background 120ms ease,
          border-color 120ms ease;
      }

      #widget button:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.3);
      }

      #widget button:active {
        background: rgba(255, 255, 255, 0.24);
      }

      #widget button:focus-visible {
        outline: 1px solid rgba(255, 255, 255, 0.6);
      }

      .h {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="widget">
      <div class="info">
        <div class="h">
          <div class="field">
            <span class="label">Hash</span>
            <span class="value" id="hash-value">&mdash;</span>
          </div>

          <div class="field">
            <span class="label">Colors</span>
            <span class="value" id="color-value">&mdash;</span>
          </div>

          <div class="mode">
            <span class="label">Mode</span>
            <span class="value" id="mode-value">&mdash;</span>
          </div>
        </div>
        <div class="field">
          <span class="label">f(z)</span>
          <span class="value" id="equation-value">&mdash;</span>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="regenerate">Regenerate</button>
        <button type="button" id="share">Share</button>
        <button type="button" id="download">Download</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
