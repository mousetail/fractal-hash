<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fractal Hash</title>
    <link rel="stylesheet" href="./src/style.css" >
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="widget">
      <div class="info">
        <div class="h">
          <div class="field">
            <span class="label">Hash</span>
            <span class="value" id="hash-value">&mdash;</span>
          </div>

          <div class="field">
            <span class="label">Colors</span>
            <span class="value" id="color-value">&mdash;</span>
          </div>

          <div class="mode">
            <span class="label">Mode</span>
            <span class="value" id="mode-value">&mdash;</span>
          </div>
        </div>
        <div class="field">
          <span class="label">f(z)</span>
          <span class="value" id="equation-value">&mdash;</span>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="regenerate">Regenerate</button>
        <button type="button" id="share">Share</button>
        <button type="button" id="download">Download</button>
      </div>
      <hr>
      <div class="h">
      <a href="https://github.com/mousetail/fractal-hash">GitHub</a> <a href="https://mousetail.nl">Mousetail</a>
      <a href="https://discord.gg/ugbfdgzpjK">Discord</a>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
